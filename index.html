<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="我的个人网站">
    <title>我的个人网站</title>
    <style>
        * {
            box-sizing: border-box;
        }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
    }
    main {
        width: min(90%, 680px);
        padding: 56px 32px;
        text-align: center;
        background: white;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    h1 {
        font-size: clamp(30px, 6vw, 48px);
        margin-bottom: 16px;
    }
    p {
        color: #6e6e73;
        line-height: 1.8;
    }
    a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        border-radius: 24px;
        background: #0071e3;
        color: white;
        text-decoration: none;
    }
    a:hover {
        background: #005bb5;
    }
</style>
</head>
<body>
    <main>
        <h1>你好，世界。</h1>
        <p>欢迎来到我的个人网站。</p>
        <p>这里将记录我的项目、兴趣与想法。</p>
        <a href="https://github.com/" target="_blank"
           rel="noopener noreferrer">访问 GitHub</a>
    </main>
</body>
</html>
